
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEYAM.ART - 20X GIANT STORE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f2f2f2;font-family:Arial}
.top{background:#111;color:#ffe600;padding:14px;text-align:center;font-size:16px;font-weight:900;letter-spacing:1px}
.header{background:#fff;padding:20px 28px;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:99;border-bottom:2px solid #111}
.logo{font-weight:900;font-size:42px;letter-spacing:-1px}
.search{flex:1;display:flex;border:3px solid #111;border-radius:14px;overflow:hidden;max-width:1000px;height:60px}
.search input{flex:1;border:0;padding:0 20px;outline:none;font-size:18px}
.search button{background:#111;color:#fff;border:0;padding:0 32px;font-weight:900;font-size:18px;cursor:pointer}
.cart{background:#111;color:#fff;padding:16px 28px;border-radius:12px;border:0;font-weight:900;font-size:18px;cursor:pointer}
.hero{max-width:1500px;margin:20px auto;padding:0 20px}
.hero-box{background:#111;color:#fff;border-radius:20px;padding:40px;display:flex;justify-content:space-between;align-items:center;min-height:380px;border:3px solid #ffe600}
.hero-left h1{font-size:64px;line-height:64px;font-weight:900}
.hero-left p{font-size:22px;margin-top:16px;color:#bbb}
.hero-stats{display:flex;gap:18px;margin-top:22px}
.stat{background:#222;border:1px solid #333;padding:14px 20px;border-radius:12px;text-align:center}
.stat b{font-size:28px;color:#ffe600;display:block}
.stat span{font-size:13px;color:#aaa}
.hero-right{width:260px;height:260px;border-radius:50%;border:6px solid #ffe600;overflow:hidden;flex-shrink:0;background:#fff}
.hero-right img{width:100%;height:100%;object-fit:cover}
.cat{max-width:1500px;margin:20px auto;padding:0 20px;display:flex;gap:12px;overflow:auto}
.cat span{background:#fff;border:2px solid #ddd;padding:14px 22px;border-radius:999px;font-size:16px;white-space:nowrap;cursor:pointer;font-weight:700}
.cat span.active{background:#111;color:#fff;border-color:#111}
.grid{max-width:1500px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:#fff;border:2px solid #e5e5e5;border-radius:18px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:scale(1.02);border-color:#111;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.card .img{height:260px;background:#f6f6f6;display:flex;align-items:center;justify-content:center;font-size:78px}
.info{padding:18px}.info h3{font-size:18px;line-height:22px;height:44px;overflow:hidden;font-weight:700}
.pr{font-weight:900;margin-top:8px;font-size:22px}
.tag{font-size:13px;color:#666;margin-top:4px}
#checkout{position:fixed;inset:0;background:#f2f2f2;z-index:200;display:none;overflow:auto}
#checkout.open{display:block}
.check-top{background:#fff;padding:20px 28px;display:flex;justify-content:space-between;border-bottom:2px solid #111;position:sticky;top:0}
.check-wrap{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:1.6fr .8fr;gap:20px;padding:0 20px 40px}
.box{background:#fff;border:2px solid #ddd;padding:24px;border-radius:16px}
.input{width:100%;padding:16px;border:2px solid #ccc;border-radius:12px;margin-top:12px;font-size:16px}
.order-btn{background:#111;color:#ffe600;width:100%;padding:18px;border:0;border-radius:12px;margin-top:16px;font-weight:900;font-size:18px;cursor:pointer}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero-box{flex-direction:column;text-align:center}.hero-left h1{font-size:38px;line-height:38px}.hero-right{width:180px;height:180px}}
</style>
</head>
<body>

<div class="top">🔥 20X GIANT STORE — 110 PRODUCTS — OWNER SEYAM — 01993239956 — BANGLADESH'S BIGGEST DESIGN STORE</div>

<div class="header">
<div class="logo">SEYAM.ART</div>
<div class="search"><input id="q" placeholder="Search 110 giant products..."><button>Search</button></div>
<button class="cart" onclick="openCheck()">🛒 <span id="cnt">0</span></button>
</div>

<div class="hero">
<div class="hero-box">
<div class="hero-left">
<h1>20X GIANT<br>DESIGN STORE</h1>
<p>110+ Premium Custom Designs — Professional Designer</p>
<div class="hero-stats">
<div class="stat"><b>110+</b><span>Designs</span></div>
<div class="stat"><b>20X</b><span>Boro</span></div>
<div class="stat"><b>Seyam</b><span>Owner</span></div>
</div>
</div>
<div class="hero-right">
<img src="https://i.pravatar.cc/300?img=32" id="owner" onerror="this.src='https://via.placeholder.com/300'">
</div>
</div>
</div>

<div class="cat" id="cats"></div>
<div class="grid" id="store"></div>

<div id="checkout">
<div class="check-top"><b style="font-size:20px">GIANT CHECKOUT</b><button onclick="closeCheck()" style="padding:10px 18px;border:2px solid #111;border-radius:10px;cursor:pointer;font-weight:700">X Close</button></div>
<div class="check-wrap">
<div class="box">
<h2>Delivery Info</h2>
<input id="n" class="input" placeholder="Full Name *">
<input id="ph" class="input" placeholder="Phone *">
<input id="ct" class="input" placeholder="City *">
<input id="ar" class="input" placeholder="Area *">
<textarea id="ad" class="input" placeholder="Full Address *" rows="3"></textarea>
</div>
<div class="box">
<h2>Order</h2>
<div id="items"></div>
<div style="display:flex;justify-content:space-between;margin-top:14px;font-size:18px"><span>Subtotal</span><b id="sub">0</b></div>
<div style="display:flex;justify-content:space-between;font-size:16px"><span>Delivery</span><b>60</b></div>
<div style="display:flex;justify-content:space-between;margin-top:14px;border-top:2px solid #111;padding-top:14px;font-size:22px"><span>Total</span><b id="tot">0</b></div>
<button class="order-btn" onclick="order()">CONFIRM GIANT ORDER ✓</button>
</div>
</div>
</div>

<script>
const CATS=["All","Islamic Poster","Logo","Business Card","Social","YouTube","CV","Wedding","Eid","T-Shirt","Menu","Banner","Flyer","ID Card","Certificate","Brand","Packaging","Instagram","Facebook","Poster"];
let PRODUCTS=[];for(let i=1;i<=110;i++){let c=CATS[1+(i%19)];PRODUCTS.push({id:i,name:c+" Giant Pro Design #"+i,price:199+(i*17)%2500,cat:c,img:["🌙","👑","📱","💼","🔥","✨","🚀","🖤","📄","💌"][i%10]})}
let cur="All",cart=[];
function renderCats(){let el=document.getElementById('cats');el.innerHTML='';CATS.forEach(x=>{let cnt=x==='All'?110:PRODUCTS.filter(p=>p.cat===x).length;el.innerHTML+=`<span class="${cur===x?'active':''}" onclick="setCat('${x}')">${x} (${cnt})</span>`})}
function setCat(x){cur=x;renderCats();render()}
function render(){let q=document.getElementById('q').value.toLowerCase();let list=PRODUCTS.filter(p=>(cur==='All'||p.cat===cur)&&p.name.toLowerCase().includes(q));let s=document.getElementById('store');s.innerHTML='';list.forEach(p=>{s.innerHTML+=`<div class="card" onclick="add(${p.id})"><div class="img">${p.img}</div><div class="info"><h3>${p.name}</h3><div class="pr">৳${p.price}</div><div class="tag">${p.cat}</div></div></div>`})}
document.getElementById('q').addEventListener('input',render);renderCats();render();
function add(id){let p=PRODUCTS.find(x=>x.id===id);let f=cart.find(x=>x.id===id);if(f)f.qty++;else cart.push({...p,qty:1});upd();openCheck()}
function upd(){document.getElementById('cnt').innerText=cart.reduce((a,b)=>a+b.qty,0);let sub=cart.reduce((a,b)=>a+b.price*b.qty,0);document.getElementById('sub').innerText='৳'+sub;document.getElementById('tot').innerText='৳'+(sub+60);let el=document.getElementById('items');el.innerHTML='';cart.forEach(x=>{el.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px"><span>${x.name} x${x.qty}</span><span>৳${x.price*x.qty}</span></div>`})}
function openCheck(){if(cart.length==0){alert('Product add koro age!');return}document.getElementById('checkout').classList.add('open');upd()}
function closeCheck(){document.getElementById('checkout').classList.remove('open')}
function order(){let n=document.getElementById('n').value,ph=document.getElementById('ph').value;if(!n||!ph){alert('Name Phone dao');return}let sub=cart.reduce((a,b)=>a+b.price*b.qty,0);let msg=`20X GIANT ORDER%0AName:${n}%0APhone:${ph}%0ATotal:${sub+60}`;window.open(`https://wa.me/8801993239956?text=${msg}`,'_blank');cart=[];upd();closeCheck()}
</script>
</body>
  </html>
