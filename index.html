<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEYAM.ART - Rokomari Order + Customize</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f5f5;font-family:Arial,sans-serif}
.header{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:24px;cursor:pointer;user-select:none}
.cart-btn{background:#111;color:#fff;padding:10px 18px;border-radius:6px;border:0;cursor:pointer;font-weight:700}
.grid{max-width:1300px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#fff;border:1px solid #e5e5e5;padding:12px;border-radius:6px}
.card .imgbox{width:100%;height:170px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;border-radius:4px}
.card .imgbox img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:13px;margin-top:8px;height:38px;overflow:hidden}
.price{font-weight:800;margin-top:6px}
.btn{background:#111;color:#fff;width:100%;padding:10px;border:0;border-radius:4px;margin-top:8px;cursor:pointer;font-weight:700}
#checkout,#admin{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;display:none;overflow:auto}
#checkout.open,#admin.open{display:block}
.check-top{background:#fff;padding:14px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}
.check-wrap{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:1.3fr .7fr;gap:20px;padding:0 15px 40px}
.form-box,.summary,.admin-box{background:#fff;border:1px solid #ddd;padding:20px;border-radius:8px}
.admin-box{max-width:600px;margin:40px auto}
.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:4px;margin-top:10px;outline:none}
.method{border:1px solid #ddd;padding:12px;border-radius:4px;margin-top:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.method.active{border-color:#111;background:#f9f9f9}
.order-btn,.save-btn{background:#111;color:#fff;width:100%;padding:14px;border:0;border-radius:4px;margin-top:15px;font-weight:800;font-size:15px;cursor:pointer}
.item{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.check-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><div class="logo" id="logo">SEYAM.ART</div><button class="cart-btn" onclick="openCheck()">🛒 Cart (<span id="cnt">0</span>)</button></div>
<div class="grid" id="store"></div>

<!-- CHECKOUT = Rokomari Style -->
<div id="checkout" onclick="if(event.target.id==='checkout')closeCheck()">
<div class="check-top"><b>Checkout - Rokomari Style</b><button onclick="closeCheck()" style="background:#fff;border:1px solid #ddd;padding:6px 14px;border-radius:4px;cursor:pointer">Close</button></div>
<div class="check-wrap">
<div class="form-box">
<h3>Shipping Address</h3>
<input id="cname" class="input" placeholder="Full Name *">
<input id="cphone" class="input" placeholder="Phone Number *">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="ccity" class="input" placeholder="City / District *"><input id="carea" class="input" placeholder="Area / Thana *"></div>
<textarea id="caddr" class="input" style="height:80px" placeholder="Full Address *"></textarea>
<h3 style="margin-top:20px">Payment Method</h3>
<div class="method active" onclick="selM(this)"><input type="radio" checked> Cash On Delivery</div>
<div class="method" onclick="selM(this)"><input type="radio"> bKash / Nagad - 01993239956</div>
</div>
<div class="summary">
<h3>Order Summary</h3>
<div id="items"></div>
<div style="display:flex;justify-content:space-between;margin-top:12px"><span>Subtotal</span><b id="sub">৳0</b></div>
<div style="display:flex;justify-content:space-between;margin-top:6px"><span>Delivery</span><b>৳60</b></div>
<div style="display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid #ddd;padding-top:10px;font-size:16px"><span>Total</span><b id="total">৳0</b></div>
<button class="order-btn" onclick="placeOrder()">Confirm Order ✓</button>
</div>
</div>
</div>

<!-- ADMIN = Customize Pic + Price -->
<div id="admin" onclick="if(event.target.id==='admin')closeAdmin()">
<div class="admin-box">
<div style="display:flex;justify-content:space-between"><h2 id="atitle">Customize - Pic & Price Edit</h2><button onclick="closeAdmin()" style="background:#fff;border:1px solid #ddd;padding:6px 12px;border-radius:4px;cursor:pointer">X</button></div>
<p style="font-size:12px;color:#666;margin-top:6px">Direct image link use koro: https://i.postimg.cc/...jpg (Postimages > Direct Link)</p>
<input id="n" class="input" placeholder="Product Name *">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="pr" type="number" class="input" placeholder="Price ৳ *"><input id="op" type="number" class="input" placeholder="Old Price"></div>
<input id="img" class="input" placeholder="Image Link https://i.postimg.cc/...jpg or Emoji 🎨">
<input id="badge" class="input" placeholder="Badge -20% / NEW">
<button id="sbtn" onclick="saveProd()" class="save-btn">Publish ✓</button>
<button id="cbtn" onclick="cancelE()" style="width:100%;margin-top:8px;display:none;background:#fff;color:#111;border:1px solid #ddd;padding:10px;border-radius:4px;cursor:pointer">Cancel Edit</button>
<div id="plist" style="margin-top:20px"></div>
</div>
</div>

<script>
let def=[
{id:1,name:"Arabic Calligraphy Poster Pack",price:350,old:500,img:"🖤",badge:"BEST"},
{id:2,name:"Luxury Logo Design Kit",price:1200,old:1800,img:"👑",badge:"-30%"},
{id:3,name:"Social Media 30 Posts Kit",price:900,old:0,img:"📱",badge:"NEW"},
{id:4,name:"Custom Poster Design",price:250,old:0,img:"🌙",badge:"HOT"},
{id:5,name:"Business Card Premium",price:800,old:1000,img:"💼",badge:""},
{id:6,name:"Festival Poster Design",price:300,old:0,img:"✨",badge:""},
{id:7,name:"YouTube Thumbnail Pack",price:500,old:700,img:"🔥",badge:""},
{id:8,name:"Brand Identity Full Kit",price:3500,old:5000,img:"🚀",badge:"PREMIUM"}
];
let products=JSON.parse(localStorage.getItem('seyam_final_v2')||'null')||def;
let cart=[];let editId=null;
function isLink(s){return s&&s.startsWith('http')}
function thumb(p){return isLink(p.img)?`<img src="${p.img}">`:p.img}
function render(){let s=document.getElementById('store');s.innerHTML='';products.forEach(p=>{s.innerHTML+=`<div class="card"><div class="imgbox">${thumb(p)}</div><h3>${p.name}</h3><div class="price">৳${p.price} ${p.old?`<span style="color:#999;text-decoration:line-through;font-size:11px;margin-left:6px">৳${p.old}</span>`:''}</div><button class="btn" onclick="addC(${p.id})">Add to Cart</button></div>`})}
render();
function addC(id){let p=products.find(x=>x.id===id);let f=cart.find(x=>x.id===id);if(f)f.qty++;else cart.push({...p,qty:1});upd();openCheck()}
function upd(){document.getElementById('cnt').innerText=cart.reduce((a,b)=>a+b.qty,0);let sub=cart.reduce((a,b)=>a+b.price*b.qty,0);document.getElementById('sub').innerText='৳'+sub;document.getElementById('total').innerText='৳'+(sub+60);let el=document.getElementById('items');el.innerHTML='';cart.forEach(c=>{el.innerHTML+=`<div class="item"><span>${c.name} x${c.qty}</span><span>৳${c.price*c.qty}</span></div>`})}
function openCheck(){if(cart.length==0){alert('Cart Khali!');return}document.getElementById('checkout').classList.add('open');upd()}
function closeCheck(){document.getElementById('checkout').classList.remove('open')}
function selM(e){document.querySelectorAll('.method').forEach(m=>{m.classList.remove('active');m.querySelector('input').checked=false});e.classList.add('active');e.querySelector('input').checked=true}
function placeOrder(){let n=document.getElementById('cname').value.trim(),ph=document.getElementById('cphone').value.trim(),ct=document.getElementById('ccity').value.trim(),ar=document.getElementById('carea').value.trim(),ad=document.getElementById('caddr').value.trim();if(!n||!ph||!ct||!ar||!ad){alert('Sob ghor puron koro!');return}let sub=cart.reduce((a,b)=>a+b.price*b.qty,0);let total=sub+60;let msg=`NEW ORDER - SEYAM.ART%0A%0AName: ${n}%0APhone: ${ph}%0ACity: ${ct}%0AArea: ${ar}%0AAddress: ${ad}%0A%0A`;cart.forEach(c=>{msg+=`• ${c.name} x${c.qty}=৳${c.price*c.qty}%0A`});msg+=`%0ATotal: ৳${total}`;window.open(`https://wa.me/8801993239956?text=${msg}`,'_blank');alert('Order Confirmed! ✅');cart=[];upd();closeCheck()}

// ADMIN FUNCTIONS - Customize Pic & Price
function openAdmin(){document.getElementById('admin').classList.add('open');renderList()}
function closeAdmin(){document.getElementById('admin').classList.remove('open');cancelE()}
function saveProd(){let name=document.getElementById('n').value.trim(),price=parseInt(document.getElementById('pr').value),old=parseInt(document.getElementById('op').value)||0,img=document.getElementById('img').value.trim()||'🎨',badge=document.getElementById('badge').value.trim();if(!name||!price){alert('Name + Price daw!');return}if(editId){let p=products.find(x=>x.id===editId);p.name=name;p.price=price;p.old=old;p.img=img;p.badge=badge;editId=null;document.getElementById('atitle').innerText='Customize - Pic & Price Edit';document.getElementById('sbtn').innerText='Publish ✓';document.getElementById('cbtn').style.display='none';}else{products.unshift({id:Date.now(),name,price,old,img,badge})}localStorage.setItem('seyam_final_v2',JSON.stringify(products));render();document.getElementById('n').value='';document.getElementById('pr').value='';document.getElementById('op').value='';document.getElementById('img').value='';document.getElementById('badge').value='';renderList();alert('Done! Picture Customize hoyeche ✅')}
function cancelE(){editId=null;document.getElementById('n').value='';document.getElementById('pr').value='';document.getElementById('op').value='';document.getElementById('img').value='';document.getElementById('badge').value='';document.getElementById('atitle').innerText='Customize - Pic & Price Edit';document.getElementById('sbtn').innerText='Publish ✓';document.getElementById('cbtn').style.display='none'}
function renderList(){let d=document.getElementById('plist');d.innerHTML='<b style="font-size:13px">YOUR PRODUCTS - Customize Pic</b>';products.forEach(p=>{d.innerHTML+=`<div style="display:flex;gap:8px;align-items:center;background:#f6f6f6;padding:10px;border-radius:8px;margin-top:8px"><div style="width:44px;height:44px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden">${isLink(p.img)?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`:p.img}</div><div style="flex:1"><div style="font-size:12px;font-weight:700">${p.name}</div><div style="font-size:11px;color:#666">৳${p.price}</div></div><div style="display:flex;flex-direction:column;gap:4px"><button onclick="editP(${p.id})" style="background:#111;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px">Edit Pic</button><button onclick="delP(${p.id})" style="background:#fee;color:#c00;border:0;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px">Del</button></div></div>`})}
function editP(id){let p=products.find(x=>x.id===id);editId=id;document.getElementById('n').value=p.name;document.getElementById('pr').value=p.price;document.getElementById('op').value=p.old||'';document.getElementById('img').value=p.img;document.getElementById('badge').value=p.badge||'';document.getElementById('atitle').innerText='Editing Pic: '+p.name;document.getElementById('sbtn').innerText='Update Picture ✓';document.getElementById('cbtn').style.display='block'}
function delP(id){if(confirm('Delete?')){products=products.filter(p=>p.id!==id);localStorage.setItem('seyam_final_v2',JSON.stringify(products));render();renderList()}}
let clicks=0;document.getElementById('logo').addEventListener('click',()=>{clicks++;if(clicks>=5){clicks=0;openAdmin()}setTimeout(()=>clicks=0,3000)})
</script>
</body>
  </html>
